<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const base = '/Mahi-Voice-Assist/';
      const path = location.pathname.startsWith(base)
        ? location.pathname.slice(base.length)
        : '';
      location.replace(`${base}?p=${encodeURIComponent(path + location.search + location.hash)}`);
    </script>
  </head>
  <body></body>
</html>
