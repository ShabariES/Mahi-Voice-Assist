name: Keep Render API awake

on:
  schedule:
    # Ping before Render's 15-minute free-service idle timeout.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render API health endpoint
        run: curl --fail --silent --show-error --max-time 120 https://mahi-voice-assist-api.onrender.com/
